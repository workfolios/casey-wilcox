name: Build Stage One Static Preview Artifact

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "stage-one-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Build static site
        env:
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}
        run: npm run build

      - name: Validate static output
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q '/casey-wilcox/' dist/index.html
          grep -q 'noindex, nofollow, noarchive, nosnippet' dist/index.html

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-one-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  record:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record build result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs
          cat > docs/STAGE_ONE_BUILD_STATUS.md <<EOF
          # Stage One Static Build Status

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Build result: **${BUILD_RESULT}**
          - Artifact name: \`stage-one-dist\`
          - Indexing state: Disabled pending Casey Wilcox review
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGE_ONE_BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Stage One static build result"
            git push origin HEAD:main
          fi
