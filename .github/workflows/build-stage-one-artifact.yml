name: Validate Stage One Static Preview Artifact

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "stage-one-validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify runtime contract
        run: |
          test "$(node --version)" = "v20.19.5"
          test "$(npm --version)" = "10.8.2"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

      - name: Validate browser-QA script syntax
        run: node --check scripts/live-stage-one-qa.mjs

      - name: TypeScript validation
        run: npm run lint

      - name: Build static site
        env:
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}
        run: npm run build

      - name: Validate static output
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q '/casey-wilcox/' dist/index.html
          grep -q 'noindex, nofollow, noarchive, nosnippet' dist/index.html

      - name: Upload validated artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage-one-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
