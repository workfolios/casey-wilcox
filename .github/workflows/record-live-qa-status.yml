name: Record Stage One Live QA Status

on:
  workflow_run:
    workflows: ["Verify Stage One Live Preview"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record first completed live-QA workflow result
        env:
          QA_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          QA_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          mkdir -p docs/live-qa
          if [ ! -f docs/live-qa/WORKFLOW_STATUS.md ]; then
            cat > docs/live-qa/WORKFLOW_STATUS.md <<EOF
          # Stage One Live QA Workflow Status

          - First completed workflow run ID: \`${QA_RUN_ID}\`
          - First completed workflow conclusion: **${QA_CONCLUSION}**
          - Workflow URL: ${QA_RUN_URL}
          EOF
          fi

          git add docs/live-qa/WORKFLOW_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record Stage One live QA workflow status"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
