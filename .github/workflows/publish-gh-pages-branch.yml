name: Publish Stage One Preview Branch

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "DEPLOYMENT_STATUS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "stage-one-publish"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify runtime contract
        run: |
          test "$(node --version)" = "v20.19.5"
          test "$(npm --version)" = "10.8.2"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

      - name: Validate browser-QA script syntax
        run: node --check scripts/live-stage-one-qa.mjs

      - name: Validate source
        run: npm run lint

      - name: Build static site
        env:
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}
        run: npm run build

      - name: Validate branch payload
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q '/casey-wilcox/' dist/index.html
          grep -q 'noindex, nofollow, noarchive, nosnippet' dist/index.html
          grep -q 'name="description"' dist/index.html
          grep -q 'rel="canonical" href="https://workfolios.github.io/casey-wilcox/"' dist/index.html
          grep -q 'property="og:site_name" content="Casey Wilcox"' dist/index.html
          grep -q 'name="twitter:image:alt"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q '"@type": "WebPage"' dist/index.html
          grep -q '"@type": "Person"' dist/index.html
          grep -q 'https://www.linkedin.com/in/casey-wilcox/' dist/index.html

      - name: Upload validated publication artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage-one-publish-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage-one-publish-dist
          path: dist

      - name: Publish validated dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish Stage One controlled preview"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

  record:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [validate, publish]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Record publication result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          mkdir -p docs
          cat > docs/GH_PAGES_BRANCH_STATUS.md <<EOF
          # Stage One gh-pages Branch Publication Status

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Validation result: **${VALIDATE_RESULT}**
          - Publication result: **${PUBLISH_RESULT}**
          - Target branch: \`gh-pages\`
          - Indexing state: Disabled pending Casey Wilcox review
          EOF

          git add docs/GH_PAGES_BRANCH_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Record gh-pages branch publication result"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
