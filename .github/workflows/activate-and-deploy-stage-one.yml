name: Activate And Deploy Stage One GitHub Pages Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "stage-one-pages-activation"
  cancel-in-progress: false

jobs:
  activate-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      activation_result: ${{ steps.activate.outputs.activation_result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Activate GitHub Pages workflow publishing
        id: activate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          current_code=$(curl -sS -o /tmp/pages-current.json -w "%{http_code}" \
            -H "$AUTH" -H "$ACCEPT" -H "$VERSION" "$API")

          if [ "$current_code" = "200" ]; then
            patch_code=$(curl -sS -o /tmp/pages-change.json -w "%{http_code}" \
              -X PUT -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API" -d '{"build_type":"workflow"}')
            if [ "$patch_code" != "204" ]; then
              echo "Pages update failed with HTTP ${patch_code}"
              cat /tmp/pages-change.json
              exit 1
            fi
            echo "activation_result=updated" >> "$GITHUB_OUTPUT"
          elif [ "$current_code" = "404" ]; then
            create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              "$API" -d '{"build_type":"workflow"}')
            if [ "$create_code" != "201" ]; then
              echo "Pages activation failed with HTTP ${create_code}"
              cat /tmp/pages-create.json
              exit 1
            fi
            echo "activation_result=created" >> "$GITHUB_OUTPUT"
          else
            echo "Pages status check failed with HTTP ${current_code}"
            cat /tmp/pages-current.json
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}
        run: npm run build

      - name: Validate deployment output
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q '/casey-wilcox/' dist/index.html
          grep -q 'noindex, nofollow, noarchive, nosnippet' dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: activate-build-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record activation and deployment result
        env:
          JOB_RESULT: ${{ needs.activate-build-deploy.result }}
          ACTIVATION_RESULT: ${{ needs.activate-build-deploy.outputs.activation_result }}
          PAGE_URL: ${{ needs.activate-build-deploy.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          mkdir -p docs
          cat > docs/STAGE_ONE_PAGES_ACTIVATION_STATUS.md <<EOF
          # Stage One GitHub Pages Activation And Deployment Status

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Activation result: **${ACTIVATION_RESULT:-not-completed}**
          - Deployment job result: **${JOB_RESULT}**
          - Pages URL: ${PAGE_URL:-Not produced}
          - Indexing state: Disabled pending Casey Wilcox review
          - Contact form: Safe inactive mode pending verified Formspree activation
          EOF

          git add docs/STAGE_ONE_PAGES_ACTIVATION_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Stage One Pages activation and deployment result"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
