name: Deploy Casey Wilcox Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          VITE_FORMSPREE_FORM_ID: ${{ vars.VITE_FORMSPREE_FORM_ID }}
        run: npm run build

      - name: Validate deployment output
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q '/casey-wilcox/' dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record deployment result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs
          cat > docs/DEPLOYMENT_STATUS.md <<EOF
          # Stage One GitHub Pages Deployment Status

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Build result: **${BUILD_RESULT}**
          - Deployment result: **${DEPLOY_RESULT}**
          - Pages URL: ${PAGE_URL:-Not produced}
          - Indexing state: Disabled pending Casey Wilcox review
          - Contact form: Safe inactive mode until a verified Formspree ID is configured
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPLOYMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Stage One Pages deployment result"
            git push origin HEAD:main
          fi
